name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }} verification
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run verify:all
      - name: Confirm generated corpus is reproducible
        run: test -z "$(git status --porcelain --untracked-files=all -- data/)"
      - name: Release gate (evals/gate.json floors)
        run: npm run gate
      - name: Confirm the committed benchmark matches the code
        run: git diff --exit-code -- docs/benchmark.md
      - name: Gate drill (each deliberate regression must be blocked)
        run: npm run gate:drill
      - name: Reference docs and MCP catalog match the server and schemas
        run: npm run docs:reference -- --check
      - name: OpenAPI document matches the code
        run: npm run docs:openapi -- --check
      - name: OpenAPI lint (Redocly, recommended ruleset)
        run: npm run lint:openapi
      - name: No breaking API change against main (oasdiff)
        run: |
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main 2>/dev/null || true
          if git cat-file -e origin/main:docs/api/openapi.json 2>/dev/null; then
            git show origin/main:docs/api/openapi.json > "$RUNNER_TEMP/base-openapi.json"
            docker run --rm -v "$RUNNER_TEMP:/base:ro" -v "$PWD:/head:ro" tufin/oasdiff:v1.33.0 \
              breaking /base/base-openapi.json /head/docs/api/openapi.json --fail-on ERR
          else
            echo "main has no published API document yet; nothing to compare"
          fi
      - name: API contract fuzzing against the spec (Schemathesis)
        run: |
          python3 -m pip install --quiet --user "schemathesis==4.29.1"
          HEATLOT_OUT="$RUNNER_TEMP/heatlot-out" node bin/heatlot.mjs serve --port 4141 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4141/api/health >/dev/null && break; sleep 1; done
          ~/.local/bin/st run docs/api/openapi.json --url http://127.0.0.1:4141 --checks all --max-examples 25
      - name: The npm package installs and runs on its own
        run: npm run smoke:package
      - name: Fetch main for the conformance baseline shrink check
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
      - name: MCP conformance at 2026-07-28 and 2025-11-25 (baseline may only shrink)
        run: npm run conformance:mcp
      - name: Install the browser for the Explorer test
        run: npx playwright install --with-deps chromium-headless-shell
      - name: Receipt Explorer in a real browser
        run: npm run test:browser
