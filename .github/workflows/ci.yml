name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }} verification
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run verify:all
      - name: Confirm generated corpus is reproducible
        run: test -z "$(git status --porcelain --untracked-files=all -- data/)"
      - name: Release gate (evals/gate.json floors)
        run: npm run gate
      - name: Confirm the committed benchmark matches the code
        run: git diff --exit-code -- docs/benchmark.md
      - name: Gate drill (each deliberate regression must be blocked)
        run: npm run gate:drill
