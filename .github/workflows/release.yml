name: Release

# A release exists only if the gate allowed it. Pushing a v* tag runs the full
# verification, the release gate and the gate drill; the GitHub release is
# created only after all three pass, with the benchmark attached.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  gate:
    name: Release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run verify:all
      - run: npm run gate
      - run: git diff --exit-code -- docs/benchmark.md
      - run: npm run gate:drill
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-gate
          path: |
            docs/benchmark.md
            reports/eval-gate/report.json

  release:
    name: Publish release
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: eval-gate
      - name: Create the GitHub release with the gate report attached
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" \
            --notes-file docs/benchmark.md \
            docs/benchmark.md reports/eval-gate/report.json
